name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: fluxbot
          POSTGRES_PASSWORD: fluxbot
          POSTGRES_DB: fluxbot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fluxbot -d fluxbot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      DATABASE_URL: postgres://fluxbot:${{ secrets.DB_URL_WITH_PASS }}@localhost:5432/fluxbot
      FLUXER_INSTANCE_ORIGIN: https://fluxer.example.com
      FLUXER_APP_ID: "900000000000000001"
      FLUXER_CLIENT_SECRET: ci-client-secret
      FLUXER_BOT_TOKEN: 900000000000000001.ci
      SESSION_SECRET: ci-session-secret-not-for-production
      ENCRYPTION_KEY: ci-encryption-key-not-for-production
      DASHBOARD_ORIGIN: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint and format check
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Apply migrations
        run: pnpm db:migrate

      - name: Build dashboard
        run: pnpm build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build container image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: fluxbot:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max