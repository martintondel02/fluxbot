name: fluxbot

x-fluxbot: &fluxbot
  build:
    context: .
  image: fluxbot:local
  env_file:
    - .env
  environment:
    DATABASE_URL: ${DATABASE_URL}

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: fluxbot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fluxbot}
      POSTGRES_DB: fluxbot
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fluxbot -d fluxbot"]
      interval: 5s
      timeout: 5s
      retries: 12

  migrate:
    <<: *fluxbot
    restart: "no"
    environment:
      ROLE: migrate
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      postgres:
        condition: service_healthy

  bot:
    <<: *fluxbot
    restart: unless-stopped
    environment:
      ROLE: bot
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  web:
    <<: *fluxbot
    restart: unless-stopped
    environment:
      ROLE: web
      PORT: 3000
      HOSTNAME: 0.0.0.0
      DATABASE_URL: ${DATABASE_URL}
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null 2>&1"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  pgdata: